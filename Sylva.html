<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EthicScore — 3D Experience</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0b0a0a;
      color: #f5f0eb;
      overflow-x: hidden;
      height: 100vh;
    }

    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .badge {
      background: rgba(155, 191, 143, 0.12);
      border: 1px solid rgba(155, 191, 143, 0.15);
      padding: 6px 20px;
      border-radius: 60px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #9bbf8f;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 16px;
      backdrop-filter: blur(8px);
    }

    .hero-content h1 {
      font-size: 4rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.05;
      max-width: 720px;
      background: linear-gradient(135deg, #f5f0eb 0%, #d9b382 40%, #9bbf8f 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-content p {
      font-size: 1.2rem;
      color: #b5a89c;
      max-width: 520px;
      margin: 16px auto 28px;
      line-height: 1.7;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .cta-btn {
      background: linear-gradient(135deg, #9bbf8f, #d9b382);
      color: #0b0a0a;
      padding: 16px 44px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1.1rem;
      border: none;
      cursor: pointer;
      transition: 0.3s;
      text-decoration: none;
      display: inline-block;
      box-shadow: 0 8px 40px rgba(155, 191, 143, 0.2);
    }
    .cta-btn:hover { transform: scale(1.04); }

    .cta-btn-secondary {
      background: rgba(255,255,255,0.04);
      color: #b5a89c;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: none;
    }
    .cta-btn-secondary:hover { background: rgba(255,255,255,0.08); }

    .legal {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 2;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      text-align: center;
      font-size: 0.6rem;
      color: #6b5e54;
    }
    .legal strong { color: #b5a89c; }

    @media (max-width: 640px) {
      .hero-content h1 { font-size: 2.4rem; }
      .hero-content p { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <canvas id="bgCanvas"></canvas>

  <section class="hero-content">
    <div class="badge">🌿 3D Experience</div>
    <h1>Know What's Really<br>in <span style="color:#d9b382;">Your Skincare</span></h1>
    <p>Immerse yourself in a 3D world of ethical beauty. Then explore our scoring tool.</p>
    <div class="btn-group">
      <a href="index.html" class="cta-btn">✨ Explore EthicScore</a>
      <a href="index.html" class="cta-btn cta-btn-secondary">📷 Barcode Scanner</a>
    </div>
  </section>

  <div class="legal">⚖️ <strong>EthicScore</strong> — Know what's truly behind your skincare. © 2026</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    (function() {
      const canvas = document.getElementById('bgCanvas');
      const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: true
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x0b0a0a, 1);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 8);
      camera.lookAt(0, 0, 0);

      // ----- LIGHTS -----
      const ambient = new THREE.AmbientLight(0x404060);
      scene.add(ambient);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      const fillLight = new THREE.DirectionalLight(0x9bbf8f, 0.6);
      fillLight.position.set(-5, 0, 5);
      scene.add(fillLight);

      const group = new THREE.Group();
      scene.add(group);

      // ----- MOSSY BRANCH -----
      function createBranch() {
        const g = new THREE.Group();
        const branchGeo = new THREE.CylinderGeometry(0.15, 0.4, 4, 8, 12);
        const branchMat = new THREE.MeshStandardMaterial({
          color: 0x3a2a1a,
          roughness: 0.9,
          metalness: 0.1,
          flatShading: true
        });
        const branch = new THREE.Mesh(branchGeo, branchMat);
        branch.position.y = -1;
        branch.rotation.z = 0.2;
        branch.rotation.x = 0.1;
        g.add(branch);

        const mossMat = new THREE.MeshStandardMaterial({ color: 0x4a7c5c, roughness: 0.95 });
        const mossPos = [
          { x: 0.2, y: -0.3, z: 0.3, s: 0.4 },
          { x: -0.2, y: 0.2, z: -0.2, s: 0.35 },
          { x: 0.1, y: 0.7, z: 0.1, s: 0.3 },
          { x: -0.1, y: -0.6, z: -0.1, s: 0.45 },
        ];
        mossPos.forEach(m => {
          const sphere = new THREE.Mesh(new THREE.SphereGeometry(m.s, 6, 6), mossMat);
          sphere.position.set(m.x, m.y + 0.1, m.z);
          sphere.scale.y = 0.6;
          g.add(sphere);
        });

        const leafMat = new THREE.MeshStandardMaterial({ color: 0x6b9e7a, roughness: 0.8 });
        for (let i = 0; i < 20; i++) {
          const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.05 + Math.random() * 0.08, 4, 4), leafMat);
          const angle = Math.random() * Math.PI * 2;
          const radius = 0.3 + Math.random() * 0.5;
          leaf.position.set(
            Math.cos(angle) * radius * 0.5,
            -1 + Math.random() * 3.5,
            Math.sin(angle) * radius * 0.5
          );
          leaf.scale.x = 0.4 + Math.random() * 0.6;
          leaf.scale.z = 0.4 + Math.random() * 0.6;
          g.add(leaf);
        }
        return g;
      }

      const branchGroup = createBranch();
      group.add(branchGroup);

      // ----- POLLEN -----
      const pollenCount = 200;
      const pollenGeo = new THREE.BufferGeometry();
      const pollenPos = new Float32Array(pollenCount * 3);
      const pollenSizes = new Float32Array(pollenCount);
      const pollenSpeeds = [];

      for (let i = 0; i < pollenCount; i++) {
        pollenPos[i * 3] = (Math.random() - 0.5) * 10;
        pollenPos[i * 3 + 1] = (Math.random() - 0.5) * 6;
        pollenPos[i * 3 + 2] = (Math.random() - 0.5) * 8;
        pollenSizes[i] = 0.01 + Math.random() * 0.03;
        pollenSpeeds.push({
          x: (Math.random() - 0.5) * 0.002,
          y: 0.001 + Math.random() * 0.003,
          z: (Math.random() - 0.5) * 0.002
        });
      }
      pollenGeo.setAttribute('position', new THREE.BufferAttribute(pollenPos, 3));
      pollenGeo.setAttribute('size', new THREE.BufferAttribute(pollenSizes, 1));

      const pollenMat = new THREE.PointsMaterial({
        color: 0xd9b382,
        size: 0.04,
        transparent: true,
        opacity: 0.6,
        blending: THREE.AdditiveBlending,
        sizeAttenuation: true
      });
      const pollen = new THREE.Points(pollenGeo, pollenMat);
      group.add(pollen);

      // ----- BUTTERFLY -----
      const butterflyGroup = new THREE.Group();
      const wingMat = new THREE.MeshStandardMaterial({
        color: 0xd9b382,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.7,
        roughness: 0.3,
        metalness: 0.2
      });
      const wingMat2 = new THREE.MeshStandardMaterial({
        color: 0x9bbf8f,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.6,
        roughness: 0.4,
        metalness: 0.1
      });

      const wingGeo = new THREE.PlaneGeometry(0.4, 0.25);
      const wing1 = new THREE.Mesh(wingGeo, wingMat);
      wing1.position.x = -0.2;
      wing1.rotation.z = 0.3;
      const wing2 = new THREE.Mesh(wingGeo, wingMat2);
      wing2.position.x = 0.2;
      wing2.rotation.z = -0.3;

      const bodyGeo = new THREE.CylinderGeometry(0.01, 0.015, 0.08);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2a1a0a });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.rotation.x = Math.PI / 2;

      butterflyGroup.add(wing1);
      butterflyGroup.add(wing2);
      butterflyGroup.add(body);
      butterflyGroup.position.set(1.2, 0.8, 1.5);
      butterflyGroup.scale.set(1.2, 1.2, 1.2);
      group.add(butterflyGroup);

      // ----- FLOATING CARDS -----
      function createFloatingCard(text, color, x, y, z) {
        const g = new THREE.Group();
        const cardMat = new THREE.MeshStandardMaterial({
          color: color,
          roughness: 0.2,
          metalness: 0.05,
          transparent: true,
          opacity: 0.15,
          side: THREE.DoubleSide
        });
        const cardGeo = new THREE.PlaneGeometry(1.2, 0.6);
        const card = new THREE.Mesh(cardGeo, cardMat);
        card.position.set(0, 0, 0);
        g.add(card);

        const borderMat = new THREE.MeshStandardMaterial({
          color: 0x9bbf8f,
          transparent: true,
          opacity: 0.1,
          side: THREE.DoubleSide,
          wireframe: true
        });
        const border = new THREE.Mesh(cardGeo, borderMat);
        border.scale.set(1.05, 1.05, 1);
        g.add(border);

        g.position.set(x, y, z);
        return g;
      }

      const card1 = createFloatingCard('Scan', 0x4a7c5c, -2.5, 1.2, 0);
      const card2 = createFloatingCard('Score', 0x6b9e7a, 2.8, -0.5, -0.5);
      const card3 = createFloatingCard('Share', 0xd9b382, -2.8, -1.0, 1);
      group.add(card1);
      group.add(card2);
      group.add(card3);

      // ----- ANIMATION -----
      let clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();

        group.rotation.y = time * 0.03;

        branchGroup.rotation.z = 0.2 + Math.sin(time * 0.2) * 0.02;
        branchGroup.rotation.x = 0.1 + Math.cos(time * 0.15) * 0.02;

        const positions = pollen.geometry.attributes.position.array;
        for (let i = 0; i < pollenCount; i++) {
          positions[i * 3] += pollenSpeeds[i].x;
          positions[i * 3 + 1] += pollenSpeeds[i].y;
          positions[i * 3 + 2] += pollenSpeeds[i].z;
          if (positions[i * 3 + 1] > 3) positions[i * 3 + 1] = -3;
          if (positions[i * 3 + 1] < -3) positions[i * 3 + 1] = 3;
          if (positions[i * 3] > 5) positions[i * 3] = -5;
          if (positions[i * 3] < -5) positions[i * 3] = 5;
        }
        pollen.geometry.attributes.position.needsUpdate = true;
        pollen.material.opacity = 0.4 + Math.sin(time * 0.3) * 0.15;

        const flap = Math.sin(time * 4) * 0.3 + 0.5;
        wing1.rotation.y = -flap * 0.8;
        wing2.rotation.y = flap * 0.8;
        butterflyGroup.position.x = 1.2 + Math.sin(time * 0.2) * 0.3;
        butterflyGroup.position.y = 0.8 + Math.sin(time * 0.3) * 0.2;
        butterflyGroup.position.z = 1.5 + Math.cos(time * 0.25) * 0.3;
        butterflyGroup.rotation.y = Math.sin(time * 0.15) * 0.5;

        const cards = [card1, card2, card3];
        const startY = [1.2, -0.5, -1.0];
        cards.forEach((card, i) => {
          card.position.y = startY[i] + Math.sin(time * 0.5 + i * 1.5) * 0.2;
          card.rotation.x = Math.sin(time * 0.3 + i * 1.2) * 0.05;
          card.rotation.z = Math.cos(time * 0.4 + i * 1.0) * 0.05;
        });

        camera.position.x = Math.sin(time * 0.02) * 0.5;
        camera.position.y = Math.sin(time * 0.015) * 0.3;
        camera.lookAt(0, 0, 0);

        renderer.render(scene, camera);
      }

      animate();

      window.addEventListener('resize', () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      });

      window.addEventListener('scroll', () => {
        const scrollY = window.scrollY;
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        const progress = maxScroll > 0 ? scrollY / maxScroll : 0;
        group.rotation.x = progress * 0.1;
        camera.position.y = -progress * 0.5;
      });

    })();
  </script>

</body>
</html>
