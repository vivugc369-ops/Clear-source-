<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Poppins', sans-serif; background: #FDFBF7; color: #1E1E1E; padding-bottom: 90px; }

.header { position: sticky; top: 0; background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; z-index: 99; }
.logo { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.leaf { width: 28px; height: 28px; background: linear-gradient(135deg, #40916c, #2d6a4f); border-radius: 8px 0; }

.container { padding: 24px 20px; max-width: 650px; margin: auto; }
.badge { color: #40916c; font-weight: 600; font-size: 11px; letter-spacing: 1.5px; display: flex; align-items: center; gap: 6px; }
h1 { font-size: 32px; font-weight: 700; line-height: 1.2; margin: 10px 0; }
h1 span { background: linear-gradient(90deg, #40916c, #95d5b2); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { color: #6c757d; margin-bottom: 24px; font-size: 15px; }

.stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin: 24px 0; }
.stat-box { background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 18px; border-radius: 16px; text-align: center; border: 1px solid rgba(0,0,0,0.05); }
.stat-num { font-size: 24px; font-weight: 700; color: #2d6a4f; }
.stat-label { font-size: 12px; color: #6c757d; }

.search { width: 100%; padding: 16px; border-radius: 16px; border: 1px solid #ddd; font-size: 15px; background: white; }

.categories { display: flex; gap: 10px; overflow-x: auto; margin: 24px 0; padding-bottom: 8px; }
.cat { padding: 10px 18px; background: white; border-radius: 24px; font-size: 14px; font-weight: 500; white-space: nowrap; border: 1px solid #e9ecef; }
.cat.active { background: #2d6a4f; color: white; border: none; }

.section-title { font-size: 18px; font-weight: 600; margin: 20px 0 12px; }
