<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClearSource - Skincare Transparency</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    
    body { 
      background: linear-gradient(180deg, #FDFBF7 0%, #F5F1E8 100%); 
      color: #1E1E1E; 
      padding-bottom: 90px; 
    }
    
    /* GLASS HEADER */
    .header { 
      position: sticky; top: 0; 
      backdrop-filter: blur(12px);
      background: rgba(255, 255, 255, 0.7);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      padding: 16px 20px; 
      display: flex; justify-content: space-between; align-items: center;
      z-index: 100;
    }
    .logo { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .leaf { width: 28px; height: 28px; background: linear-gradient(135deg, #40916c, #2d6a4f); border-radius: 8px 0; }
    
    .container { padding: 24px 20px; max-width: 650px; margin: auto; }
    
    .badge { color: #40916c; font-weight: 600; font-size: 11px; letter-spacing: 1.5px; }
    h1 { font-size: 32px; font-weight: 700; line-height: 1.2; margin: 10px 0; }
    h1 span { background: linear-gradient(90deg, #40916c, #95d5b2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .sub { color: #6c757d; margin-bottom: 24px; font-size: 15px; }
    
    /* GLASS STATS */
    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin: 24px 0; }
    .stat-box { 
      background: rgba(255, 255, 255, 0.6); 
      backdrop-filter: blur(10px);
      padding: 18px; border-radius: 16px; text-align: center;
      border: 1px solid rgba(255,255,255,0.3);
    }
    .stat-num { font-size: 24px; font-weight: 700; color: #2d6a4f; }
    .stat-label { font-size: 12px; color: #6c757d; }
    
    /* SEARCH */
    .search-wrap { position: relative; }
    .search { 
      width: 100%; padding: 16px 16px 16px 48px; border-radius: 16px; 
      border: 1px solid rgba(0,0,0,0.08); font-size: 15px; 
      background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px);
    }
    .search-icon { position: absolute; left: 16px; top: 16px; color: #999; }
    
    /* CATEGORIES */
    .categories { display: flex; gap: 10px; overflow-x: auto; margin: 24px 0; padding-bottom: 8px; }
    .cat { padding: 10px 18px; background: white; border-radius: 24px; font-size: 14px; font-weight: 500; white-space: nowrap; border: 1px solid #e9ecef; transition: 0.3s; }
    .cat.active { background: #2d6a4f; color: white; border: none; box-shadow: 0 4px 12px rgba(45,106,79,0.2); }
    
    /* PRODUCT CARDS */
    .section-title { font-size: 18px; font-weight: 600; margin: 20px 0 12px; }
    .product { 
      background: rgba(255, 255, 255, 0.7); 
      backdrop-filter: blur(10px);
      border-radius: 20px; padding: 14px; margin-bottom: 14px; 
      display: flex; gap: 14px; align-items: center;
      border: 1px solid rgba(255,255,255,0.4);
      transition: transform 0.2s;
    }
    .product:active { transform: scale(0.98); }
    .product img { width: 64px; height: 64px; border-radius: 16px; object-fit: cover; background: #eee; }
    .score { margin-left: auto; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .score.good { background: #d8f3dc; color: #1b4332; }
    .score.mid { background: #fff3bf; color: #8a6d3b; }
    .score.bad { background: #f8d7da; color: #721c24; }
    
    /* BOTTOM NAV GLASS */
    .bottom-nav { 
      position: fixed; bottom: 0; left: 0; right: 0; 
      background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px);
      display: flex; justify-content: space-around; padding: 14px 0; 
      border-top: 1px solid rgba(0,0,0,0.05); 
    }
    .nav-item { text-align: center; font-size: 12px; color: #6c757d; }
    .nav-item.active { color: #2d6a4f; font-weight: 600; }
    .nav-icon { font-size: 22px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo"><div class="leaf"></div> ClearSource</div>
    <div style="font-size:20px">🔔</div>
  </div>

  <div class="container">
    <div class="badge">🌿 SKINCARE TRANSPARENCY</div>
    <h1>Know what's really<br><span>in your routine.</span></h1>
    <p class="sub">Ethics scores, ingredient flags, and true brand ownership — all in one place.</p>

    <div class="stats">
      <div class="stat-box"><div class="stat-num">
