      document.getElementById('imageLightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      document.getElementById('imageLightbox').classList.remove('open');
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

    // ============ RENDER PRODUCTS ============
    function renderProducts(list, targetId) {
      const container = document.getElementById(targetId);
      if (!container) return;
      if (list.length === 0) {
        container.innerHTML = '<div class="empty-state">🌿 No products found</div>';
        return;
      }
      container.innerHTML = list.map((p) => `
        <div class="card" onclick="openDetail(${p.id})">
          <img src="${p.img}" alt="${p.name}" onclick="event.stopPropagation(); openLightbox('${p.img}');" />
          <div class="card-info">
            <div class="brand">${p.brand}</div>
            <div class="name">${p.name}</div>
            <div class="price">${p.price}</div>
          </div>
          <div class="right-col">
            <div class="score ${scoreClass(p.score)}">${p.score}</div>
            <button class="add-btn ${routine.includes(p.id) ? 'added' : ''}" onclick="event.stopPropagation(); toggleRoutine(${p.id});">
              ${routine.includes(p.id) ? '✓' : '+'}
            </button>
          </div>
        </div>
      `).join('');
    }

    // ============ TOGGLE ROUTINE ============
    function toggleRoutine(id) {
      const idx = routine.indexOf(id);
      if (idx > -1) routine.splice(idx, 1);
      else routine.push(id);
      saveState();
      const onRoutine = document.getElementById('routineView').style.display === 'block';
      if (onRoutine) renderRoutine();
      else renderProducts(filteredProducts(), 'productList');
    }

    function filteredProducts() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      return products.filter(p => p.brand.toLowerCase().includes(q) || p.name.toLowerCase().includes(q));
    }

    // ============ RENDER ROUTINE ============
    function renderRoutine() {
      const list = products.filter(p => routine.includes(p.id));
      const avgContainer = document.getElementById('avgContainer');
      if (list.length === 0) {
        avgContainer.innerHTML = '';
        document.getElementById('routineList').innerHTML = '<div class="empty-state">🌱 No products in routine</div>';
        document.getElementById('routineAnalyzer').innerHTML = '';
        return;
      }
      const avg = Math.round(list.reduce((s, p) => s + p.score, 0) / list.length);
      avgContainer.innerHTML = `
        <div class="avg-box">
          <div style="font-size:0.75rem;color:#6b5e54;font-weight:600;">ROUTINE ETHICS AVG</div>
          <div class="num">${avg}<span style="font-size:0.9rem;color:#6b5e54;">/100</span></div>
          <div style="font-size:0.8rem;color:#6b5e54;">${list.length} products</div>
        </div>
      `;
      renderProducts(list, 'routineList');
      analyzeRoutine(list);
    }

    // ============ ANALYZE ROUTINE ============
    function analyzeRoutine(list) {
      const analyzer = document.getElementById('routineAnalyzer');
      if (list.length === 0) { analyzer.innerHTML = ''; return; }
      const categories = list.map(p => p.category);
      let tips = [];
      if (!categories.includes('cleanser')) tips.push('🧼 Missing a cleanser');
      if (!categories.includes('serum')) tips.push('🧪 Add a serum');
      if (!categories.includes('moisturizer')) tips.push('💧 You need a moisturizer');
      if (!categories.includes('sunscreen')) tips.push('☀️ Don\'t forget sunscreen');
      if (!categories.includes('toner')) tips.push('🌸 Add a toner');
      if (!categories.includes('mask')) tips.push('🌿 Try a face mask');

      let html = `<div class="avg-box" style="background:rgba(155,191,143,0.03);">
        <div style="font-weight:700;color:#f5f0eb;">🧠 Routine Tips</div>
      `;
      if (tips.length === 0) {
        html += `<p style="color:#9bbf8f;">✨ Perfect routine!</p>`;
      } else {
        html += tips.map(t => `<div style="padding:6px 0;color:#b5a89c;font-size:0.9rem;">${t}</div>`).join('');
      }
      html += `</div>`;
      analyzer.innerHTML = html;
    }

    // ============ OPEN DETAIL (WORKS EVERY TIME) ============
    function openDetail(id) {
      const p = products.find(x => x.id === id);
      if (!p) return;

      const overlay = document.getElementById('detailOverlay');
      const sheet = document.getElementById('detailSheet');

      const ingredientsHTML = isPro ? `
        <div style="margin-top:16px;font-weight:700;color:#f5f0eb;">Ingredients <span class="pro-badge">PRO</span></div>
        <div>${p.ingredients.map(i => `<span class="ingredient-chip">✓ ${i}</span>`).join('')}</div>
      ` : `
        <div class="lock-overlay"><div class="lock-icon">🔒</div><p>Ingredients are Pro only</p><button class="upgrade-btn" onclick="closeDetail();showUpgrade();">Upgrade</button></div>
      `;

      const parentHTML = isPro ? `
        <div class="breakdown-row"><span>Parent Co.</span><span>${p.conglo ? 40 : 90}/100</span></div>
        <div class="bar-bg"><div class="bar-fill" data-target="${p.conglo ? 40 : 90}%" style="background:${p.conglo ? '#d9b382' : '#9bbf8f'}"></div></div>
        <div style="color:#b5a89c;margin-top:6px;">Parent: <strong style="color:#f5f0eb;">${p.parent}</strong></div>
      ` : '';

      sheet.innerHTML = `
        <div class="close-btn" onclick="closeDetail()">✕</div>
        <div style="font-size:0.8rem;text-transform:uppercase;color:#6b5e54;">${p.brand}</div>
        <div style="font-size:1.4rem;font-weight:700;color:#f5f0eb;margin:4px 0 8px;">${p.name}</div>
        <div style="font-size:1.1rem;color:#b5a89c;margin-bottom:12px;">${p.price}</div>

        <a href="${p.buyLink}" target="_blank" class="buy-btn"><i class="fas fa-search"></i> View on Amazon</a>

        <div style="display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 12px;">
          <span style="background:rgba(155,191,143,0.06);color:#9bbf8f;padding:4px 14px;border-radius:30px;font-weight:700;font-size:0.75rem;">${p.cf ? '✓ Cruelty-Free' : '✗ Not CF'}</span>
          <span style="background:rgba(217,179,130,0.06);color:#d9b382;padding:4px 14px;border-radius:30px;font-weight:700;font-size:0.75rem;">${p.pkg ? 'Sustainable' : 'Non-Sust'}</span>
        </div>

        <div style="font-weight:700;color:#f5f0eb;">Score Breakdown</div>
        <div class="breakdown-row"><span>Cruelty-Free</span><span>${p.cf ? 100 : 20}/100</span></div>
        <div class="bar-bg"><div class="bar-fill" data-target="${p.cf ? 100 : 20}%" style="background:${p.cf ? '#9bbf8f' : '#b35c4a'}"></div></div>
        <div class="breakdown-row"><span>Packaging</span><span>${p.pkg ? 85 : 40}/100</span></div>
        <div class="bar-bg"><div class="bar-fill" data-target="${p.pkg ? 85 : 40}%" style="background:${p.pkg ? '#9bbf8f' : '#d9b382'}"></div></div>

        ${parentHTML}
        ${ingredientsHTML}

        <button style="width:100%;margin-top:20px;padding:16px;background:rgba(255,255,255,0.02);color:#f5f0eb;border:1px solid rgba(255,255,255,0.04);border-radius:16px;font-weight:700;cursor:pointer;" onclick="toggleRoutine(${p.id});openDetail(${p.id});">
          ${routine.includes(p.id) ? '✓ In Routine' : '+ Add to Routine'}
        </button>
        <div style="font-size:0.65rem;color:#4a3f38;text-align:center;margin-top:12px;border-top:1px solid rgba(255,255,255,0.02);padding-top:12px;">
          Opens Amazon search for this product.
        </div>
      `;

      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';

      setTimeout(() => {
        document.querySelectorAll('.bar-fill').forEach(el => {
          el.style.width = el.dataset.target;
        });
      }, 100);
    }

    function closeDetail() {
      document.getElementById('detailOverlay').classList.remove('open');
      document.body.style.overflow = '';
    }

    // ============ SWITCH TABS ============
    function switchTab(tab) {
      document.getElementById('discoverView').style.display = tab === 'discover' ? 'block' : 'none';
      document.getElementById('routineView').style.display = tab === 'routine' ? 'block' : 'none';
      document.getElementById('navDiscover').classList.toggle('active', tab === 'discover');
      document.getElementById('navRoutine').classList.toggle('active', tab === 'routine');
      if (tab === 'routine') renderRoutine();
    }

    // ============ UPGRADE ============
    function showUpgrade() {
      if (isPro) { alert("Already Pro!"); return; }
      if (confirm("Upgrade to Pro? $4.99/month")) {
        isPro = true;
        saveState();
        alert("Welcome to Pro!");
      }
    }

    // ============ SEARCH ============
    document.getElementById('searchInput').addEventListener('input', function() {
      renderProducts(filteredProducts(), 'productList');
    });

    // ============ INIT ============
    document.addEventListener('DOMContentLoaded', function() {
      renderProducts(products, 'productList');
    });

    // ============ CLOSE DETAIL ON BACKDROP ============
    document.getElementById('detailOverlay').addEventListener('click', function(e) {
      if (e.target === this) closeDetail();
    });
  </script>
</body>
</html>
