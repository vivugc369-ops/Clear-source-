<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClearSource</title><style>
body{font-family:Arial;background:#FDFBF7;padding:20px;padding-bottom:80px}
h1{color:#2d6a4f}
.product{background:white;border-radius:16px;padding:16px;margin-bottom:12px;display:flex;gap:12px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
.product img{width:60px;height:60px;border-radius:12px}
.score{margin-left:auto;padding:6px 12px;border-radius:20px;font-weight:bold;font-size:14px}
.good{background:#d8f3dc;color:#1b4332}.mid{background:#fff3bf;color:#8a6d3b}.bad{background:#f8d7da;color:#721c24}
.btn{background:#2d6a4f;color:white;border:none;padding:8px 12px;border-radius:10px;cursor:pointer;margin-top:6px}
.btn.remove{background:#dc3545}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:12px;border-top:1px solid #eee}
.nav{font-size:12px;text-align:center;cursor:pointer;color:#666}
.nav.active{color:#2d6a4f;font-weight:bold}
.hidden{display:none}
</style></head><body>
<h1>ClearSource</h1>
<div id="discover"></div>
<div id="routine" class="hidden"><h2>Your Routine</h2><div id="routineItems"></div></div>

<div class="bottom">
<div class="nav active" onclick="showTab('discover')">🔍<br>Discover</div>
<div class="nav" onclick="showTab('routine')">📦<br>Routine</div>
</div>

<script>
const products=[
{id:1,name:"Milky Jelly Cleanser",brand:"GLOSSIER",price:18,score:72,img:"https://images.unsplash.com/photo-1556228720-195a672e8a03?w=60"},
{id:2,name:"Superfood Cleanser",brand:"YOUTH TO THE PEOPLE",price:38,score:88,img:"https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=60"},
{id:3,name:"Niacinamide Serum",brand:"THE ORDINARY",price:7,score:91,img:"https://images.unsplash.com/photo-1556228453-efd6c1ff04f6?w=60"}
];
let routine = JSON.parse(localStorage.getItem('routine')) || [];

function save(){localStorage.setItem('routine',JSON.stringify(routine))}

function render(){
document.getElementById('discover').innerHTML=products.map(p=>`
<div class="product">
<img src="${p.img}">
<div style="flex:1">
<b style="font-size:11px;color:#666">${p.brand}</b><br>
<b>${p.name}</b><br>
$${p.price} 
<button class="btn" onclick="toggle(${p.id})">${routine.includes(p.id)?'✓ Added':'+ Add'}</button>
</div>
<div class="score ${p.score>80?'good':p.score>50?'mid':'bad'}">${p.score}</div>
</div>
`).join('');

document.getElementById('routineItems').innerHTML= routine.length===0 ? '<p style="color:#666">No products yet. Tap +Add to add!</p>' : 
routine.map(id=>{let p=products.find(x=>x.id===id); return `
<div class="product">
<img src="${p.img}">
<div style="flex:1"><b>${p.name}</b><br>${p.brand}</div>
<button class="btn remove" onclick="toggle(${p.id})">Remove</button>
</div>`}).join('');
}

function toggle(id){
if(routine.includes(id)) routine=routine.filter(x=>x!==id); else routine.push(id);
save(); render();
}
function showTab(tab){
document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));
document.querySelectorAll('.nav')[tab==='discover'?0:1].classList.add('active');
document.getElementById('discover').classList.toggle('hidden', tab!=='discover');
document.getElementById('routine').classList.toggle('hidden', tab!=='routine');
}
render();
</script></body></html>
