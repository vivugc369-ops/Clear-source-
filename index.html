<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClearSource</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial;background:#FDFBF7;padding-bottom:80px}
header{padding:20px;background:white;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
h1{color:#2d6a4f;font-size:24px}
.hero{padding:30px 20px}
.hero h2{font-size:32px;line-height:1.2;margin-bottom:16px}
.hero h2 span{color:#2d6a4f}
.search{width:100%;padding:14px 16px;border-radius:12px;border:1px solid #ddd;margin-bottom:16px;font-size:16px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.filter{padding:10px 18px;border-radius:24px;border:1px solid #ddd;background:white;white-space:nowrap;cursor:pointer}
.filter.active{background:#2d6a4f;color:white;border-color:#2d6a4f}
.product{background:white;border-radius:16px;padding:16px;margin:12px 20px;display:flex;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.product img{width:70px;height:70px;border-radius:12px;object-fit:cover}
.product-info{flex:1}
.brand{font-size:11px;color:#666;text-transform:uppercase}
.name{font-size:16px;font-weight:bold;margin:4px 0}
.meta{font-size:13px;color:#666;margin-bottom:8px}
.btn{background:#2d6a4f;color:white;border:none;padding:8px 16px;border-radius:10px;font-weight:bold;cursor:pointer}
.score{padding:10px 14px;border-radius:50%;font-weight:bold;font-size:16px;height:fit-content}
.score.mid{background:#fff3bf;color:#8a6d3b}
.score.good{background:#d8f3dc;color:#1b4332}
.score.bad{background:#f8d7da;color:#721c24}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:10px;border-top:1px solid #eee}
.nav{text-align:center;font-size:12px;color:#666;cursor:pointer}
.nav.active{color:#2d6a4f;font-weight:bold}
.hidden{display:none}
</style>
</head>
<body>
<header><h1>ClearSource</h1>🔔</header>

<div id="discover">
<div class="hero">
<h2>Stop guessing.<br><span>Start knowing.</span></h2>
<input class="search" placeholder="🔍 Search products..." id="search">
<div class="filters">
<div class="filter active" onclick="filter('all')">All</div>
<div class="filter" onclick="filter('cleanser')">Cleanser</div>
<div class="filter" onclick="filter('serum')">Serum</div>
<div class="filter" onclick="filter('moisturizer')">Moisturizer</div>
</div>
</div>
<div id="productList"></div>
</div>

<div id="routine" class="hidden"><h2 style="padding:20px">Your Routine</h2><div id="routineList"></div></div>
<div id="profile" class="hidden"><h2 style="padding:20px">Profile</h2></div>

<div class="bottom">
<div class="nav active" onclick="show('discover')">🔍<br>Discover</div>
<div class="nav" onclick="show('routine')">📦<br>Routine</div>
<div class="nav" onclick="show('profile')">👤<br>Profile</div>
</div>

<script>
const products=[
{id:1,name:"Milky Jelly Cleanser",brand:"GLOSSIER",price:18,score:72,type:"cleanser",meta:"Cruelty-free",img:"https://images.unsplash.com/photo-1556228720-195a672e8a03?w=70"},
{id:2,name:"Superfood Cleanser",brand:"YOUTH TO THE PEOPLE",price:38,score:88,type:"cleanser",meta:"Cruelty-free",img:"https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=70"},
{id:3,name:"Niacinamide 10% Serum",brand:"THE ORDINARY",price:7,score:91,type:"serum",meta:"Vegan",img:"https://images.unsplash.com/photo-1556228453-efd6c1ff04f6?w=70"},
{id:4,name:"C-Firma Serum",brand:"DRUNK ELEPHANT",price:80,score:85,type:"serum",meta:"Cruelty-free",img:"https://images.unsplash.com/photo-1556228453-efd6c1ff04f6?w=70"},
{id:5,name:"Vitamin C Serum",brand:"SKINCEUTICALS",price:166,score:89,type:"serum",meta:"Cruelty-free",img:"https://images.unsplash.com/photo-1556228453-efd6c1ff04f6?w=70"},
{id:6,name:"Moisturizing Cream",brand:"CERA VE",price:19,score:65,type:"moisturizer",meta:"Parent: L'Oreal",img:"https://images.unsplash.com/photo-1556228720-195a672e8a03?w=70"},
{id:7,name:"Fit Me Foundation",brand:"MAYBELLINE",price:10,score:32,type:"moisturizer",meta:"Animal testing",img:"https://images.unsplash.com/photo-1598440947619-2c35fc9aa908?w=70"},
{id:8,name:"Aloe Gel",brand:"NATURAL",price:12,score:95,type:"moisturizer",meta:"Vegan",img:"https://images.unsplash.com/photo-1556228720-195a672e8a03?w=70"}
];
let routine=JSON.parse(localStorage.getItem('r'))||[]; let currentFilter='all';

function render(){
let filtered=products.filter(p=>currentFilter==='all'||p.type===currentFilter);
document.getElementById('productList').innerHTML=filtered.map(p=>`
<div class="product">
<img src="${p.img}">
<div class="product-info">
<div class="brand">${p.brand}</div>
<div class="name">${p.name}</div>
<div class="meta">${p.meta} · $${p.price}</div>
<button class="btn" onclick="add(${p.id})">${routine.includes(p.id)?'✓ Added':'+ Add'}</button>
</div>
<div class="score ${p.score>80?'good':p.score>50?'mid':'bad'}">${p.score}</div>
</div>`).join('');
document.getElementById('routineList').innerHTML=routine.length===0?'<p style="padding:20px">No products yet</p>':routine.map(id=>{let p=products.find(x=>x.id===id);return `<div class="product"><img src="${p.img}"><div class="product-info"><div class="name">${p.name}</div><div class="brand">${p.brand}</div></div></div>`}).join('');
}
function add(id){if(!routine.includes(id))routine.push(id);localStorage.setItem('r',JSON.stringify(routine));render()}
function filter(t){currentFilter=t;document.querySelectorAll('.filter').forEach(f=>f.classList.remove('active'));event.target.classList.add('active');render()}
function show(tab){document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));document.querySelectorAll('.nav')[tab==='discover'?0:tab==='routine'?1:2].classList.add('active');['discover','routine','profile'].forEach(t=>document.getElementById(t).classList.toggle('hidden',t!==tab))}
render();
</script>
</body>
</html>
